version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: swift
    directories:
      - "/Modules/*"
      - "/Tuist"
    schedule:
      interval: weekly
    groups:
      swift-minor-and-patch:
        update-types:
          - minor
          - patch
