name: Docs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      # The paths and key match the CI workflow, so both share one cache.
      - name: Cache SPM builds
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Tuist/.build
            Modules/*/.build
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-xcode26.6-

      - name: Generate package documentation
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          # A target opts into the site with a .docc catalog, so the
          # package and target lists derive from the catalogs on disk.
          # Without the explicit target flags, combined mode would also
          # document dependencies.
          packages="$(find Modules -name '*.docc' -path '*/Sources/*' \
            -not -path '*/.build/*' | sed 's|/Sources/.*||' | sort -u)"
          for package in $packages; do
            slug="$(basename "$package" | tr '[:upper:]' '[:lower:]')"
            target_flags=()
            for catalog in $(find "$package/Sources" -name '*.docc' | sort); do
              target_flags+=(--target "$(basename "$(dirname "$catalog")")")
            done
            (cd "$package" && swift package \
              --allow-writing-to-directory "$SITE/$slug" \
              generate-documentation \
              --enable-experimental-combined-documentation \
              "${target_flags[@]}" \
              --disable-indexing \
              --transform-for-static-hosting \
              --hosting-base-path "apple-api-viewer/$slug" \
              --output-path "$SITE/$slug")
          done
          {
            echo '<!doctype html><html><head><meta charset="utf-8">'
            echo '<title>Apple API Viewer documentation</title></head><body>'
            echo '<h1>Apple API Viewer documentation</h1><ul>'
            for package in $packages; do
              name="$(basename "$package")"
              slug="$(echo "$name" | tr '[:upper:]' '[:lower:]')"
              echo "<li><a href=\"$slug/documentation/\">$name</a></li>"
            done
            echo '</ul></body></html>'
          } > "$SITE/index.html"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
