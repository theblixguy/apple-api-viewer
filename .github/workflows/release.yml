name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      # The app token lets the appcast commit bypass the main ruleset,
      # which blocks the default workflow token.
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # The build number is git rev-list --count HEAD, so the checkout
          # needs full history.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install Tuist
        run: |
          # The runner image ships stale casks. Without the update, brew
          # would install a months-old Tuist.
          brew update --quiet
          brew install --cask tuist

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import signing certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 -d > "$RUNNER_TEMP/developer-id.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign

          # Without this, codesign would stop at a UI prompt for the
          # imported key.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Write notarization and Sparkle keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed25519"

      - name: Run release script
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY_PATH: ${{ runner.temp }}/sparkle_ed25519
          # The script renders the release notes through the GitHub
          # markdown API, which needs a token.
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          Scripts/release.sh "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The changelog section is the single source of the notes, so
          # the release page matches the Sparkle update dialog.
          gh release create "v$VERSION" ".release/AppleAPIViewer-$VERSION.dmg" --title "v$VERSION" --notes-file .release/release-notes.md

      - name: Commit appcast
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          # The release script leaves the new appcast.xml as a local change
          # on a detached HEAD. Without the copy, the forced checkout of
          # main would discard it.
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"
          git checkout -f main
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml

          git add appcast.xml
          if git diff --cached --quiet; then
            echo "No appcast changes to commit"
          else
            git commit -m "Update appcast for v$VERSION"
            git push
          fi

      - name: Remove temporary keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
